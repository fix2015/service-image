services:
  image-service:
    build: .
    ports:
      - "3021:3021"
    environment:
      - PORT=3021
      - SERVICE_API_KEY=${SERVICE_API_KEY:-dev-key-change-me}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION:-eu-central-1}
    volumes:
      - uploads:/tmp/uploads
    restart: unless-stopped

volumes:
  uploads:
